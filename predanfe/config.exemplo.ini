; Copie este arquivo para "config.ini" (na mesma pasta) e preencha a senha.
; O config.ini fica só neste computador; não envie para ninguém.

[banco]
; Servidor Firebird do SysPDV (2.5, porta 3050)
host = 127.0.0.1
porta = 3050
; Banco da retaguarda (conferido no registro: HKLM\SOFTWARE\WOW6432Node\Syspdv_server\UniConnection)
arquivo = C:\Syspdv\syspdv_srv.fdb
usuario = SYSDBA
senha =

; fbclient.dll 64 bits. Em branco = usa o que vem dentro do programa
; (pasta fbclient); senão, o do Firebird 5.0 instalado.
fbclient =

[automatico]
; De quantos em quantos segundos o PreDANFE-Automatico verifica o banco
intervalo_segundos = 10

[saida]
; Pasta onde os PDFs serão gravados (nada é gravado na pasta do SysPDV)
pasta_pdf = pdf
